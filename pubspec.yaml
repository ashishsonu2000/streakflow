name: streak_calculator_flutter
description: A Flutter version of the Streak Calculator dashboard.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1

  confetti: ^0.7.0
  audioplayers: ^6.8.1

  
  shared_preferences: ^2.5.3

  go_router: ^16.2.0

  package_info_plus: ^8.0.2

  google_fonts: ^6.3.2

  flutter_riverpod: ^2.6.1

  intl: ^0.20.2

  equatable: ^2.0.7



  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  uuid: ^4.5.1

  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^1.1.1
  flutter_slidable: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
