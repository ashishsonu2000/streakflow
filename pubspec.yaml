name: streak_calculator_flutter
description: A Flutter version of the Streak Flow habit tracker.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# ==============================================================
# DEPENDENCIES
# ==============================================================

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Reviews / links
  in_app_review: ^2.0.12
  url_launcher: ^6.3.2

  # Notifications
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1

  # UI / media
  confetti: ^0.7.0
  audioplayers: ^6.8.1

  # Storage / navigation
  shared_preferences: ^2.5.3
  go_router: ^16.2.0
  package_info_plus: ^10.2.1

  # Fonts
  google_fonts: ^6.3.2

  # State management
  flutter_riverpod: ^2.6.1

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  file_picker: ^12.1.0
  share_plus: ^13.3.0

  # Database
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # Charts / UI
  fl_chart: ^1.1.1
  flutter_slidable: ^4.0.1
  flutter_timezone: ^5.1.0


# ==============================================================
# DEV DEPENDENCIES
# ==============================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.5.4
  isar_community_generator: ^3.3.2

  # App icon generator
  flutter_launcher_icons: ^0.14.4

  # Native splash generator
  flutter_native_splash: ^2.4.8


# ==============================================================
# FLUTTER
# ==============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/branding/


# ==============================================================
# APP ICON
# ==============================================================

flutter_launcher_icons:
  android: true
  ios: true

  # Complete Streak Flow app icon
  image_path: "assets/branding/app_icon.png"

  # ------------------------------------------------------------
  # Android adaptive icon
  # ------------------------------------------------------------

  adaptive_icon_background: "#06143F"
  adaptive_icon_foreground: "assets/branding/app_icon.png"

  # ------------------------------------------------------------
  # iOS
  # ------------------------------------------------------------

  remove_alpha_ios: true


# ==============================================================
# NATIVE SPLASH SCREEN
# ==============================================================

flutter_native_splash:
  android: true
  ios: true

  # ------------------------------------------------------------
  # Native splash background
  # ------------------------------------------------------------

  color: "#06143F"

  # Use ONLY the logo here.
  #
  # Do NOT use splash_screen.png here because Android 12+
  # displays the native splash using a system-defined icon mask.
  #
  image: "assets/branding/app_icon.png"

  # ------------------------------------------------------------
  # Android
  # ------------------------------------------------------------

  android_gravity: center

  # ------------------------------------------------------------
  # iOS
  # ------------------------------------------------------------

  ios_content_mode: center

  # ------------------------------------------------------------
  # Android 12+
  # ------------------------------------------------------------

  android_12:
    color: "#06143F"

    # Android 12 requires a centered splash icon.
    image: "assets/branding/app_icon.png"

    icon_background_color: "#06143F"