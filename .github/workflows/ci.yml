name: CI

# Same checks as GitLab CI (.gitlab-ci.yml): analyze, test, Android
# release build - plus the unsigned iOS build. Runs on the GitHub mirror
# (public repository: Actions minutes are free), so merges can be
# verified even when GitLab CI minutes run out.

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "ci/**"
      - "refactor/**"
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build Android (release)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 9 / AGP need JDK 17+; the app targets Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - run: flutter pub get

      # ================================================================
      # VERIFICATION BUILD
      #
      # Without android/key.properties (never committed) the release
      # build is signed with the debug key (see android/app/build.gradle.kts)
      # - it proves the app compiles and packages, but is NOT a Play
      # upload. Play uploads are built locally with the upload key.
      #
      # No artifacts are uploaded: this repository is public.
      # ================================================================

      - run: flutter build apk --release
      - run: flutter build appbundle --release

  build-ios:
    name: Build iOS (unsigned)
    needs: analyze-and-test
    # macos-15 ships Xcode 16.x; the Google Mobile Ads iOS SDK
    # (google_mobile_ads 9.x) requires Xcode 16.0 or higher.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      # On a fresh checkout, `flutter pub get` copies google_mobile_ads
      # into build/ios/SourcePackages/ for Swift Package Manager, and
      # the copy (rsync) fails if that parent folder doesn't exist yet.
      - name: Prepare Swift Package Manager plugin folder
        run: mkdir -p build/ios/SourcePackages

      - run: flutter pub get

      # ================================================================
      # UNSIGNED BUILD
      #
      # Verifies the app actually compiles and links for iOS. This does
      # NOT produce an installable/TestFlight-ready IPA - Apple requires
      # a real Developer certificate + provisioning profile for that,
      # which must come from your own Apple Developer account. Nothing
      # here fabricates or assumes those credentials.
      # ================================================================

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Upload unsigned .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned.app
          path: build/ios/iphoneos/Runner.app
          retention-days: 14

      # ================================================================
      # SIGNED BUILD (disabled until you provide real credentials)
      #
      # To produce a real, installable/TestFlight-ready IPA:
      #
      # 1. In your Apple Developer account, create a Distribution
      #    certificate and an App Store provisioning profile for
      #    com.codesapience.streakflow.
      # 2. Export the certificate as a base64-encoded .p12, and the
      #    provisioning profile as base64.
      # 3. Add these as GitHub Actions secrets on this repo:
      #      IOS_DIST_CERTIFICATE_BASE64
      #      IOS_DIST_CERTIFICATE_PASSWORD
      #      IOS_PROVISIONING_PROFILE_BASE64
      #      IOS_EXPORT_OPTIONS_PLIST_BASE64  (an ExportOptions.plist,
      #        see https://flutter.dev/to/ipa-export-options)
      #      APPLE_TEAM_ID
      # 4. Uncomment the step below (and remove --no-codesign above,
      #    or add a separate signed job) to run:
      #
      # - name: Build signed IPA
      #   env:
      #     TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     echo "${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12
      #     echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision
      #     echo "${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}" | base64 --decode > ExportOptions.plist
      #     security create-keychain -p actions build.keychain
      #     security default-keychain -s build.keychain
