# ======================================================================
# GitLab CI pipeline: analyze, test, and Android build.
#
# iOS builds run in GitHub Actions instead (.github/workflows/ios-build.yml)
# - this GitLab account's plan doesn't have hosted macOS runners enabled
# (confirmed: jobs targeting "saas-macos-medium-m1" fail with
# no_matching_runner). If macOS runners get enabled on this project later,
# see the previous version of this file (git history) for a ready-made
# iOS build job to bring back.
#
# The Android release build signs with the debug keystore (see
# android/app/build.gradle.kts) until android/key.properties + a real
# keystore are added as CI/CD variables/files - it is NOT suitable for
# Play Store upload as-is. See that file's comments for how to add
# real signing.
# ======================================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'

variables:
  # ghcr.io/cirruslabs/flutter doesn't publish every patch release -
  # 3.44.0 is the newest 3.44.x tag it has. Check available tags at
  # https://github.com/cirruslabs/docker-images-flutter/pkgs/container/flutter
  # before bumping.
  FLUTTER_DOCKER_TAG: "3.44.0"

stages:
  - analyze
  - test
  - build

.flutter_linux:
  image: ghcr.io/cirruslabs/flutter:${FLUTTER_DOCKER_TAG}
  cache:
    key:
      files:
        - pubspec.lock
    paths:
      - .pub-cache/
  before_script:
    - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    - flutter pub get

analyze:
  extends: .flutter_linux
  stage: analyze
  script:
    - flutter analyze

test:
  extends: .flutter_linux
  stage: test
  script:
    - flutter test

build_android:
  extends: .flutter_linux
  stage: build
  needs:
    - analyze
    - test
  script:
    - flutter build apk --release
    - flutter build appbundle --release
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    expire_in: 2 weeks
